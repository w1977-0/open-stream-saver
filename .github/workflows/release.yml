name: Build and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: cli/go.sum
      - name: Test Go CLI
        working-directory: cli
        run: |
          go test ./...
          go vet ./...
      - name: Check extension JavaScript
        run: |
          node --check extension/background.js
          node --check extension/popup.js

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    name: Cross-compile and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset: open-stream-saver_linux_amd64.tar.gz
            binary: open-stream-saver
            archive: tar
          - goos: darwin
            goarch: amd64
            asset: open-stream-saver_darwin_amd64.tar.gz
            binary: open-stream-saver
            archive: tar
          - goos: darwin
            goarch: arm64
            asset: open-stream-saver_darwin_arm64.tar.gz
            binary: open-stream-saver
            archive: tar
          - goos: windows
            goarch: amd64
            asset: open-stream-saver_windows_amd64.zip
            binary: open-stream-saver.exe
            archive: zip
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: cli/go.sum
      - name: Build CLI and package extension
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          BINARY: ${{ matrix.binary }}
          ASSET: ${{ matrix.asset }}
          ARCHIVE: ${{ matrix.archive }}
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist/package/open-stream-saver-${VERSION}/extension
          cd cli
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/w1977-0/open-stream-saver/cli/internal/app.Version=${VERSION}" -o "../dist/package/open-stream-saver-${VERSION}/${BINARY}" ./cmd/open-stream-saver
          cd ..
          cp README.md LICENSE NOTICE.md "dist/package/open-stream-saver-${VERSION}/"
          cp -R extension/. "dist/package/open-stream-saver-${VERSION}/extension/"
          if [ "${ARCHIVE}" = "zip" ]; then
            (cd dist/package && zip -qr "../${ASSET}" "open-stream-saver-${VERSION}")
          else
            tar -C dist/package -czf "dist/${ASSET}" "open-stream-saver-${VERSION}"
          fi
      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release with checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum open-stream-saver_* > SHA256SUMS.txt
          gh release create "$TAG" \
            --title "Open Stream Saver $TAG" \
            --generate-notes \
            open-stream-saver_* SHA256SUMS.txt
