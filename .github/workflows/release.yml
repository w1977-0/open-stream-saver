name: Build and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: cli/go.sum
      - name: Test and vet Go modules
        working-directory: cli
        run: |
          go test ./...
          go vet ./...
      - name: Smoke-test CLI install
        shell: bash
        working-directory: cli
        run: |
          export GOBIN="$RUNNER_TEMP/media-archiver-bin"
          mkdir -p "$GOBIN"
          go install ./cmd/open-stream-saver
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$GOBIN/open-stream-saver.exe" --help
          else
            "$GOBIN/open-stream-saver" --help
          fi
      - name: Check extension assets
        shell: bash
        run: |
          python3 -m json.tool extension/manifest.json >/dev/null
          node --check extension/background.js
          node --check extension/popup.js

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    name: GoReleaser publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: cli/go.sum
      - name: Validate release configuration
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
      - name: Build archives and publish release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
